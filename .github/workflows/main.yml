name: Build and publish Potato Or Not

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/main.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release assets
        env:
          POTATO_OR_NOT_REPO: ${{ github.repository }}
        run: python3 scripts/build-release.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('module.json'))['version'])")
          gh release create "v${VERSION}" dist/module.json dist/module.zip \
            --title "Potato Or Not ${VERSION} (Foundry 14)" \
            --notes "Community update of Potato Or Not by Wasp and Fantasy Computerworks. GNU GPL v3. Foundry VTT 14 and dnd5e 6.0.6 target; live compatibility testing remains pending." \
            --latest \
            --target "${GITHUB_SHA}"
